name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Self-test the validator
        run: python3 scripts/validate.py --self-test
      - name: Validate skill definitions and example data
        run: python3 scripts/validate.py
